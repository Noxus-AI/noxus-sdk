# Canonical CI for the public Noxus-AI/noxus-sdk repo.
# Source of truth lives in the platform repo (scripts/sdk_sync_assets/ci.yaml)
# and is copied to .github/workflows/ci.yaml by scripts/sync_sdk.py.
name: CI

on:
  push:
    branches: [main]
    tags:
      - "*" # Push events to matching any tag for publishing
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ruff is pinned: must match the version in uv.lock so formatting
      # stays identical to the platform repo that syncs into this one.
      - name: Lint check
        run: uvx ruff@0.6.3 check .

      - name: Format check
        run: uvx ruff@0.6.3 format --check .

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv pip install --system -e "." pytest pytest-asyncio filelock

      - name: Run unit tests
        run: pytest tests/unit/ -x --tb=short || [ $? -eq 5 ]

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are configured
        id: check-secrets
        run: |
          if [ -z "$NOXUS_API_KEY" ] || [ -z "$NOXUS_BASE_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::NOXUS_API_KEY or NOXUS_BASE_URL not set — skipping integration tests"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NOXUS_API_KEY: ${{ secrets.NOXUS_API_KEY }}
          NOXUS_BASE_URL: ${{ secrets.NOXUS_BASE_URL }}

      - name: Install uv
        if: steps.check-secrets.outputs.skip == 'false'
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        if: steps.check-secrets.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check-secrets.outputs.skip == 'false'
        run: uv pip install --system -e "." pytest pytest-asyncio pytest-subtests filelock

      - name: Run integration tests
        if: steps.check-secrets.outputs.skip == 'false'
        run: pytest tests/integration/ -x --tb=short
        env:
          NOXUS_API_KEY: ${{ secrets.NOXUS_API_KEY }}
          NOXUS_BASE_URL: ${{ secrets.NOXUS_BASE_URL }}

  build:
    needs: [lint, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      # Release gate: install the BUILT WHEEL (not editable) and exercise the
      # packaging-sensitive paths. An editable install hides missing package
      # data and undeclared deps; this catches them before they ship to PyPI.
      - name: Smoke-test built wheel
        run: |
          set -euxo pipefail
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          # CLI imports + plugin templates are packaged
          /tmp/wheel-test/bin/noxus plugin create --help
          # synced modules import with only declared deps (catches missing deps)
          /tmp/wheel-test/bin/python -c "import noxus_sdk; import noxus_sdk.documentation; import noxus_sdk.cli.main"
          # cookiecutter plugin template ships inside the wheel
          /tmp/wheel-test/bin/python -c "from pathlib import Path; import noxus_sdk; p = Path(noxus_sdk.__file__).parent / 'templates' / 'cookiecutter-plugin' / 'cookiecutter.json'; assert p.exists(), f'plugin template missing from wheel: {p}'"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [build, integration-tests]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/noxus-sdk
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

  release-assets:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload wheel to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
