# Canonical pyproject.toml for the public Noxus-AI/noxus-sdk repo.
#
# This is the source of truth for the PUBLISHED package's build configuration
# and dependencies. scripts/sync_sdk.py copies it into the public repo on every
# sync, PRESERVING the public repo's existing `version` (releases are cut there
# with bump2version, so the sync must never change the version).
#
# Differences vs the internal noxus-sdk/pyproject.toml are intentional:
#   - build backend is hatchling (includes ALL package data: NCL modules AND the
#     cookiecutter plugin templates — setuptools' packages.find dropped both)
#   - `fastmcp` is omitted (the noxus_sdk/mcp module is internal-only and excluded
#     from the sync), while `rapidfuzz` IS required (noxus_sdk/documentation.py,
#     which is synced publicly, imports it).
[project]
name = "noxus-sdk"
version = "0.5.6"
description = "Software development kit to extend the Noxus platform"
requires-python = ">=3.10"
readme = "README.md"
keywords = ["noxus", "sdk", "plugin", "development"]
authors = [
    { name = "Noxus Team", email = "support@noxus.ai" }
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "cookiecutter>=2.6.0",
    "fastapi>=0.116.1",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "pydantic>=2.11.7",
    "ruff==0.6.3",
    "semver>=3.0.4",
    "typer[all]>=0.16.0",
    "uvicorn>=0.35.0",
    "pyyaml>=6.0",
    "gitpython>=3.1.55",
    "pillow>=12.3.0",
    "markdownify>=1.1.0",
    "async-lru>=2.0.5",
    "rapidfuzz>=3.0.0",
    "httpx-sse",
    "aiofiles",
    "tomli>=2.0.0; python_version < '3.11'"
]

[project.urls]
Homepage = "https://noxus.ai"
Repository = "https://github.com/Noxus-AI/noxus-sdk"

[project.scripts]
noxus = "noxus_sdk.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noxus_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "bump2version>=1.0.1",
    "jupyter>=1.1.1",
    "notebook>=7.4.5",
]
