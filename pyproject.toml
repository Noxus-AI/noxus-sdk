[project]
name = "noxus-sdk"
version = "0.5.3"
description = "Software development kit to extend the Noxus platform"
requires-python = ">=3.10"
readme = "README.md"
keywords = ["noxus", "sdk", "plugin", "development"]
authors = [
    { name = "Noxus Team", email = "support@noxus.ai" }
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "cookiecutter>=2.6.0",
    "fastapi>=0.116.1",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "pydantic>=2.11.7",
    "ruff==0.6.3",
    "semver>=3.0.4",
    "typer[all]>=0.16.0",
    "uvicorn>=0.35.0",
    "pyyaml>=6.0",
    "gitpython>=3.1.45",
    "pillow>=11.3.0",
    "markdownify>=1.1.0",
    "async-lru>=2.0.5",
    "httpx-sse",
    "aiofiles"
]

[project.urls]
Homepage = "https://noxus.ai"
Repository = "https://github.com/Noxus-AI/noxus-sdk"

[project.scripts]
noxus = "noxus_sdk.cli.main:main"

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["noxus_sdk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "bump2version>=1.0.1",
    "jupyter>=1.1.1",
    "notebook>=7.4.5",
]
